<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillBridge AI — Authentication</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
</head>
<body class="auth-body">
  <div class="auth-card-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <span class="logo-badge">⚡</span>
          <span>SkillBridge AI</span>
        </a>
        <p class="auth-subtitle">Industry Career OS for Students, Mentors & Companies</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab-btn active">Sign In</button>
        <button id="tabRegister" class="auth-tab-btn">Register</button>
      </div>

      <!-- Error / Success Alert -->
      <div id="authAlert" class="auth-alert hidden"></div>

      <!-- Form -->
      <form id="authForm">
        <!-- Register-only: Name -->
        <div id="groupName" class="form-group hidden">
          <label for="authName">Full Name</label>
          <input type="text" id="authName" placeholder="e.g. Adarsh Pratap Singh">
        </div>

        <!-- Register-only: Role Selector -->
        <div id="groupRole" class="form-group hidden">
          <label for="authRole">I am a</label>
          <select id="authRole">
            <option value="student">🎓 Student / Candidate</option>
            <option value="mentor">💼 Industry Mentor</option>
            <option value="company">🏢 Hiring Partner / Company</option>
          </select>
        </div>

        <!-- Register-only: Dynamic Role Details -->
        <div id="groupExtraStudent" class="form-group hidden">
          <label for="studentTargetRole">Target Career Role</label>
          <input type="text" id="studentTargetRole" placeholder="e.g. Full Stack Software Engineer">
        </div>

        <div id="groupExtraMentor" class="form-group hidden">
          <label for="mentorCompany">Current Company & Job Title</label>
          <input type="text" id="mentorCompany" placeholder="e.g. TechNova Labs — Senior Architect">
        </div>

        <div id="groupExtraCompany" class="form-group hidden">
          <label for="companyName">Company / Organization Name</label>
          <input type="text" id="companyName" placeholder="e.g. CloudSphere Systems">
        </div>

        <!-- Common: Email -->
        <div class="form-group">
          <label for="authEmail">Email Address</label>
          <input type="email" id="authEmail" required placeholder="you@university.edu">
        </div>

        <!-- Common: Password -->
        <div class="form-group">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>

        <button type="submit" id="authSubmitBtn" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div class="auth-footer">
        <span class="auth-footer-text">🔒 Protected by 256-bit encryption & PostgreSQL Auth</span>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
